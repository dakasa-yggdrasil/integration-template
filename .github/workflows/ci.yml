name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint describe contract
        # Fast smoke that catches manifest drift between SupportedExecuteOperations,
        # ResourceTypes and ActionCatalog — same drift pattern that bit
        # integration-aws v1.22.0 and integration-grafana. Runs before
        # full tests so the signal is immediate.
        run: go run ./cmd/lint-action-catalog

      - name: Test
        run: go test ./...

      - name: Build image
        run: docker build -t integration-template:ci .
